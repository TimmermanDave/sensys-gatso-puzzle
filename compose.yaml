services:
  api:
    build:
      context: .
      target: api
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  puzzle:
    depends_on:
      - api
    build: .
    ports:
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
